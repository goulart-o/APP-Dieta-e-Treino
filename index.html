<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ficha Forte — controle de treinos (academia e CrossFit), dieta, macros, hidratação, periodização e desafios.">
<meta name="theme-color" content="#1F6FD1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ficha Forte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de treino com cabeçalho fixo, abas roláveis e telas em coluna única que viram grade no desktop.
   Cores das anilhas olímpicas: proteína vermelha, carbo amarelo, gordura verde, água azul. */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#14202B; --muted:#5B6B7A; --line:#D8E0E7;
  --accent:#1F6FD1; --accent-ink:#FFFFFF; --accent-soft:#E2EEFB;
  --prot:#D9412F; --carb:#E8A812; --fat:#7DB24E; --water:#2A8BE6;
  --good:#2E8B57; --warn:#C98A00; --bad:#C8402F;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 4px 14px rgba(20,32,43,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
  --fig:#2D3B48; --fig2:#95A3B0; --eq:#56616C; --plate:#1F6FD1; --hi:#D9412F; --pad:#CDBB9E; --cable:#8A96A2;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141B; --surface:#151F29; --surface-2:#1B2733; --ink:#E7EEF5; --muted:#8C9CAC; --line:#26333F;
  --accent:#4C9BFF; --accent-ink:#06121F; --accent-soft:#16304D;
  --prot:#F06450; --carb:#F5BE36; --fat:#98C96A; --water:#4FA8FF;
  --good:#4CC07F; --warn:#E3AA2A; --bad:#F06450; --shadow:0 1px 2px rgba(0,0,0,.3);
  --fig:#C9D6E2; --fig2:#5E6F80; --eq:#9AA8B5; --plate:#4C9BFF; --hi:#F06450; --pad:#6B5B45; --cable:#8796A5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#151F29; --surface-2:#1B2733; --ink:#E7EEF5; --muted:#8C9CAC; --line:#26333F;
  --accent:#4C9BFF; --accent-ink:#06121F; --accent-soft:#16304D;
  --prot:#F06450; --carb:#F5BE36; --fat:#98C96A; --water:#4FA8FF;
  --good:#4CC07F; --warn:#E3AA2A; --bad:#F06450; --shadow:0 1px 2px rgba(0,0,0,.3);
  --fig:#C9D6E2; --fig2:#5E6F80; --eq:#9AA8B5; --plate:#4C9BFF; --hi:#F06450; --pad:#6B5B45; --cable:#8796A5; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:1.75rem;font-weight:700}
h3{font-size:1.25rem;font-weight:700}
h4{font-size:1.02rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabeçalho e abas */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;padding-block:10px 4px}
.mark{width:34px;height:34px;flex:none}
.brand h1{white-space:nowrap;font-size:clamp(1.25rem,5vw,1.55rem);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.brand .who{margin-left:auto;text-align:right;font-size:.82rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)} .sync.err i{background:var(--bad)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:10px 12px 11px;font-family:var(--f-display);font-weight:700;font-size:1.02rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}

main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px}
.view{display:grid;gap:16px}
.head{display:flex;flex-wrap:wrap;align-items:end;gap:10px 16px;justify-content:space-between}
.head .sub{color:var(--muted);margin-top:4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.card.flat{background:var(--surface-2);box-shadow:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:grid;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%}
.pill-phase{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;min-height:40px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:.88rem}
.btn.icon{width:36px;padding:0;min-height:36px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.f{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 10px;min-height:40px;color:var(--ink);font-weight:500}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stat{display:grid;gap:2px}
.stat .v{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1}
.stat .v small{font-size:.9rem;font-weight:600;color:var(--muted);margin-left:2px}
.stat .l{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.hl td{background:var(--accent-soft)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s}
.macro-line{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.macro-line b{font-weight:700}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.note{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:6px;padding:10px 12px;font-size:.9rem}
.note.warn{border-left-color:var(--warn)}
.list{display:grid}
.list>.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.list>.it:last-child{border-bottom:0}
.it .grow{flex:1;min-width:0}
.it .t{font-weight:600}
.swatch{width:10px;align-self:stretch;border-radius:4px;flex:none}
.chart-box{position:relative;height:240px;width:100%}
.chart-box.sm{height:190px}
canvas{max-width:100%}
.example-flag{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--warn)}

/* Hoje */
.today-hero{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.sess{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.sess.done{opacity:.6}
.sess .hr{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);width:44px;flex:none}
.check{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}

/* Treinar */
.exc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.exc-h{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.exc-h .thumb{width:56px;height:56px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);flex:none;display:grid;place-items:center;overflow:hidden;cursor:pointer;font-family:var(--f-display);font-weight:700;color:var(--muted)}
.exc-h .thumb img{width:100%;height:100%;object-fit:cover}
.exc-h .meta{flex:1;min-width:0;display:grid;gap:3px}
.exc-h .meta .t{font-weight:700;font-size:1.02rem}
.sets{display:grid;padding:6px 10px 10px}
.set{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr) 40px;gap:8px;align-items:center;padding:4px 4px}
.set.hd{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.set .idx{font-family:var(--f-mono);color:var(--muted);text-align:center}
.set input,.set select{min-height:38px;padding:6px 8px;text-align:center;font-family:var(--f-mono)}
.set.ok input,.set.ok select{background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.suggest{font-size:.82rem;color:var(--good);font-weight:600}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:25;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--ink);color:var(--bg)}
.timer-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px}
.timer .clock{font-family:var(--f-mono);font-size:1.6rem;font-weight:600}
.timer .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}

/* Agenda */
.week{display:grid;gap:10px;grid-template-columns:repeat(7,minmax(0,1fr))}
@media (max-width:900px){.week{grid-template-columns:1fr}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.day-h .dn{font-family:var(--f-display);font-weight:700;font-size:1.15rem;text-transform:uppercase}
.day-h .dd{font-family:var(--f-mono);color:var(--muted);font-size:.85rem}
.dsess{border-radius:8px;padding:7px 8px;font-size:.85rem;background:var(--surface-2);border-left:4px solid var(--accent);display:grid;gap:1px;cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.dsess.done{opacity:.55;text-decoration:line-through}
.dsess .x{font-weight:700}
.dt-select{font-size:.8rem;min-height:30px!important;padding:3px 6px!important}

/* Dieta */
.macro-hero{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:center}
@media (max-width:760px){.macro-hero{grid-template-columns:1fr}}
.macro-art{width:100%;max-width:360px;justify-self:center}
.meal{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.meal-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.meal-h .hr{font-family:var(--f-mono);font-weight:600}
.meal-h .t{font-weight:700;flex:1;min-width:140px}
.ops{display:grid;gap:10px;padding:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.op{border:1.5px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;cursor:pointer;background:var(--surface);text-align:left;align-content:start}
.op[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.op ul{margin:0;padding-left:16px;font-size:.86rem;color:var(--muted)}
.op .mm{font-family:var(--f-mono);font-size:.78rem}
.mm .p{color:var(--prot)} .mm .c{color:var(--carb)} .mm .g{color:var(--fat)}

/* Água */
.water-wrap{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}
@media (max-width:760px){.water-wrap{grid-template-columns:1fr}}
.bottle{position:relative;width:min(100%,320px);aspect-ratio:640/568;justify-self:center;max-width:100%}
.bottle img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.bottle .b-empty{filter:grayscale(1) brightness(1.1);opacity:.28}
.b-tint .body{position:absolute;left:0;right:0;bottom:0;height:var(--fill,0%);background:linear-gradient(to top,color-mix(in srgb,var(--water) 60%,transparent),color-mix(in srgb,var(--water) 35%,transparent));transition:height 1.2s cubic-bezier(.3,.7,.2,1)}
.bottle .b-full{clip-path:inset(calc(100% - var(--fill,0%)) 0 0 0);transition:clip-path 1.2s cubic-bezier(.3,.7,.2,1)}
.bottle .b-tint{position:absolute;inset:0;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;overflow:hidden;pointer-events:none}
.b-tint .lvl{position:absolute;left:-50%;width:200%;bottom:calc(var(--fill,0%) - 9px);height:18px;transition:bottom 1.2s cubic-bezier(.3,.7,.2,1);background:radial-gradient(circle at 10px -4px,transparent 11px,color-mix(in srgb,var(--water) 75%,white) 12px) repeat-x;background-size:20px 18px;animation:wave 2.4s linear infinite;opacity:.9}
.b-tint .bub{position:absolute;bottom:0;width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);animation:rise 3.2s ease-in infinite;opacity:0}
@keyframes wave{to{transform:translateX(20px)}}
@keyframes rise{0%{bottom:0;opacity:0}15%{opacity:.9}100%{bottom:calc(var(--fill,0%) - 8px);opacity:0}}
.bottle.flex{animation:flex .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes flex{0%{transform:scale(1)}35%{transform:scale(1.07) rotate(-3deg)}65%{transform:scale(.98) rotate(2deg)}100%{transform:scale(1)}}
.bottle.full::after,.bottle.over::after{content:"META BATIDA!";position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--water);letter-spacing:.06em;white-space:nowrap;animation:pop .6s both}
@keyframes pop{from{transform:translate(-50%,10px) scale(.6);opacity:0}}
.drop{position:absolute;width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--water);pointer-events:none;animation:splash 1s ease-out forwards}
@keyframes splash{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.classic svg{width:100%;height:100%}
.classic .wv{animation:wave2 3s linear infinite}
@keyframes wave2{to{transform:translateX(-120px)}}
.anim-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.anim-pick button{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:8px;display:grid;gap:4px;justify-items:center;cursor:pointer;font-weight:600;font-size:.85rem}
.anim-pick button[aria-pressed="true"]{border-color:var(--water);background:var(--accent-soft)}
.anim-pick img,.anim-pick svg{width:100%;max-width:90px;aspect-ratio:1;object-fit:contain}
.water-btns{display:flex;flex-wrap:wrap;gap:8px}
.water-btns .btn{border-color:color-mix(in srgb,var(--water) 40%,var(--line))}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:40;background:rgba(8,14,20,.55);display:grid;place-items:end center;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:700px){.modal-bg{place-items:center}}
.modal{background:var(--surface);color:var(--ink);width:min(100%,640px);max-height:min(92vh,100%);overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;align-content:start}
@media (min-width:700px){.modal{border-radius:16px}}
.modal.wide{width:min(100%,900px)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ex-img{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.pr-card{display:grid;gap:4px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.pr-card .v{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1}
.pick-list{max-height:52vh;overflow:auto;display:grid;gap:6px}
.pick-list button{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 10px;cursor:pointer;display:grid;gap:2px}
.pick-list button:hover{border-color:var(--accent)}
.tex{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(4,minmax(0,.7fr)) auto;gap:6px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.tex{grid-template-columns:repeat(4,minmax(0,1fr))}.tex .nm{grid-column:1/-1}.tex .acts{grid-column:1/-1;justify-content:flex-end}}
.tex input{min-height:36px;padding:5px 8px}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.wkc{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);display:grid;gap:3px;font-size:.85rem}
